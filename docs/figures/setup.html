<text x="40" y="68" class="title">Install skills, then connect your apps</text><text x="40" y="108" class="body">MCP lets Codex call tools in your own apps and accounts.</text><rect x="40" y="152" width="416" height="340" rx="6" class="zone"/><rect x="504" y="152" width="416" height="340" rx="6" fill="none" stroke="#b6bfce" stroke-dasharray="6 5"/><text x="64" y="192" class="heading">Codex installs the skills</text><text x="528" y="192" class="heading">You connect the apps</text><rect x="64" y="216" width="368" height="64" rx="6" class="focal"/><text x="84" y="244" class="body">Design entry skill</text><text x="84" y="268" class="code">design / SKILL.md</text><rect x="64" y="300" width="368" height="80" rx="6" class="panel"/><text x="84" y="332" class="body">7 pinned source collections</text><text x="84" y="360" class="small">Original files, licenses and hash checks</text><text x="64" y="432" class="small">Run doctor to verify these files.</text><text x="64" y="458" class="small">The installer preserves Codex settings.</text><text x="528" y="256" class="body">BrowserOS Neo</text><text x="528" y="282" class="tiny">Pair Codex on its MCP connection board.</text><text x="528" y="368" class="body">Penpot</text><text x="528" y="394" class="tiny">Set up your account and workspace.</text><text x="40" y="540" class="body">Then test live access: read a browser page and the Penpot file state.</text></svg></div></main></body></html>
