<text x="40" y="44" class="eyebrow">CODEX DESIGN WORKFLOW / 01 — PROCESS</text>
<text x="40" y="108" class="title">From intent to verified interface</text>
<text x="40" y="148" class="small">An approved direction becomes a reusable system, then a working interface.</text><path d="M180 240 V288" class="line" marker-end="url(#workflow-workflow-arrow)"/><path d="M320 396 H348" class="line" marker-end="url(#workflow-workflow-arrow)"/><path d="M488 240 V288" class="line" marker-end="url(#workflow-workflow-arrow)"/><path d="M628 396 H656" class="line" marker-end="url(#workflow-workflow-arrow)"/><path d="M796 240 V288" class="line" marker-end="url(#workflow-workflow-arrow)"/><path d="M936 396 H964" class="line" marker-end="url(#workflow-workflow-arrow)"/><path d="M1104 240 V288" class="line" marker-end="url(#workflow-workflow-arrow)"/><rect x="40" y="184" width="1200" height="56" class="focal"/><text x="60" y="219" class="heading">DESIGN</text><text x="208" y="219" class="body">Brief + context → one lead skill + targeted specialists</text><rect x="40" y="288" width="280" height="288" class="card"/><text x="60" y="320" class="eyebrow">01</text><text x="60" y="356" class="heading">pen.dev</text><text x="60" y="384" class="small">Concept</text><text x="60" y="428" class="body">Composition, imagery,</text><text x="60" y="456" class="body">icons and motion intent</text><path d="M60 472 H300" class="rule"/><text x="60" y="504" class="small">Editable concept + assets</text><text x="60" y="532" class="small">+ motion prototype</text><text x="60" y="556" class="model">Sol · high</text><rect x="348" y="288" width="280" height="288" class="card"/><text x="368" y="320" class="eyebrow">02</text><text x="368" y="356" class="heading">Penpot</text><text x="368" y="384" class="small">Design system</text><text x="368" y="428" class="body">Tokens, components,</text><text x="368" y="456" class="body">states and responsiveness</text><path d="M368 472 H608" class="rule"/><text x="368" y="504" class="small">System + screen IDs</text><text x="368" y="532" class="small">+ motion specification</text><text x="368" y="556" class="model">Sol · high</text><rect x="656" y="288" width="280" height="288" class="card"/><text x="676" y="320" class="eyebrow">03</text><text x="676" y="356" class="heading">Project code</text><text x="676" y="384" class="small">Implementation</text><text x="676" y="428" class="body">Reuse the system,</text><text x="676" y="456" class="body">assets and components</text><path d="M676 472 H916" class="rule"/><text x="676" y="504" class="small">Working UI</text><text x="676" y="532" class="small">+ interaction behavior</text><text x="676" y="556" class="model">Sol · medium</text><rect x="964" y="288" width="280" height="288" class="card"/><text x="984" y="320" class="eyebrow">04</text><text x="984" y="356" class="heading">BrowserOS Neo</text><text x="984" y="384" class="small">Verification</text><text x="984" y="428" class="body">Compare real rendering;</text><text x="984" y="456" class="body">exercise user scenarios</text><path d="M984 472 H1224" class="rule"/><text x="984" y="504" class="small">Verified result</text><text x="984" y="532" class="small">+ focused corrections</text><text x="984" y="556" class="model">Sol · high</text><text x="40" y="620" class="eyebrow">MOTION IS SPECIFIED, BUILT AND VERIFIED THROUGHOUT</text><text x="40" y="652" class="body">Icons + complex procedural motion in pen.dev: Astra · medium</text><text x="40" y="684" class="tiny">Models are recommendations. Fix discrepancies at the relevant stage; preserve the approved style.</text>
</svg>
