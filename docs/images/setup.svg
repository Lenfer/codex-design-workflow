<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="setup-title setup-desc" id="setup-root">
<title id="setup-title">Install skills, then connect your apps</title>
<desc id="setup-desc">The installer places Design and seven source collections on disk; the recipient connects apps through their own MCP setup.</desc>
<defs>
      <style>#setup-root { color: #20283c; }
      #setup-root .diagram-container { width:100%;overflow-x:auto }
      #setup-root text { font-family:Arial,Helvetica,sans-serif;fill:#20283c }
      #setup-root .title { font-family:Georgia,serif;font-size:36px;letter-spacing:-.4px }
      #setup-root .heading { font-size:22px;font-weight:600 }
      #setup-root .body { font-size:18px }
      #setup-root .small { font-size:16px;fill:#566278 }
      #setup-root .tiny { font-size:14px;fill:#566278 }
      #setup-root .code { font-family:ui-monospace,monospace;font-size:16px;fill:#384da0 }
      #setup-root .line { fill:none;stroke:#566278;stroke-width:1.5 }
      #setup-root .rule { fill:none;stroke:#d6dbe5;stroke-width:1 }
      #setup-root .panel { fill:#fff;stroke:#b6bfce;stroke-width:1.2 }
      #setup-root .focal { fill:#e9ecf8;stroke:#384da0;stroke-width:1.5 }
      #setup-root .zone { fill:#fff;stroke:#c8cfdd;stroke-width:1 }
      @media print {
#setup-root .diagram-container { overflow-x:visible }
}</style><marker id="setup-setup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#566278"/></marker></defs>
<rect width="960" height="600" fill="#f4f5f8"/>
<text x="40" y="68" class="title">Install skills, then connect your apps</text><text x="40" y="108" class="body">MCP lets Codex call tools in your own apps and accounts.</text><rect x="40" y="152" width="416" height="340" rx="6" class="zone"/><rect x="504" y="152" width="416" height="340" rx="6" fill="none" stroke="#b6bfce" stroke-dasharray="6 5"/><text x="64" y="192" class="heading">Codex installs the skills</text><text x="528" y="192" class="heading">You connect the apps</text><rect x="64" y="216" width="368" height="64" rx="6" class="focal"/><text x="84" y="244" class="body">Design entry skill</text><text x="84" y="268" class="code">design / SKILL.md</text><rect x="64" y="300" width="368" height="80" rx="6" class="panel"/><text x="84" y="332" class="body">7 pinned source collections</text><text x="84" y="360" class="small">Original files, licenses and hash checks</text><text x="64" y="432" class="small">Run doctor to verify these files.</text><text x="64" y="458" class="small">The installer preserves Codex settings.</text><text x="528" y="240" class="body">BrowserOS Neo</text><text x="528" y="266" class="tiny">Pair Codex on its MCP connection board.</text><text x="528" y="324" class="body">pen.dev</text><text x="528" y="350" class="tiny">Install the app and connect its tools.</text><text x="528" y="408" class="body">Penpot</text><text x="528" y="434" class="tiny">Set up your account and workspace.</text><text x="40" y="540" class="body">Then test live access: read a browser page and the design apps’ current state.</text></svg>
