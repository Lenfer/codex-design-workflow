<title id="setup-title">Set up your own design environment</title>
<desc id="setup-desc">Install and verify skills, pair the recipient’s own applications, then prove live tool access.</desc>
<defs>
      <style>#setup-root { color: #20283c; }
      #setup-root .diagram-container { width:100%;overflow-x:auto }
      #setup-root text { font-family:Arial,Helvetica,sans-serif;fill:#20283c }
      #setup-root .title { font-family:Georgia,serif;font-size:48px;letter-spacing:-1px }
      #setup-root .eyebrow { font-family:monospace;font-size:13px;letter-spacing:2px;fill:#566278 }
      #setup-root .heading { font-size:24px;font-weight:600 }
      #setup-root .body { font-size:18px }
      #setup-root .small { font-size:16px;fill:#566278 }
      #setup-root .tiny { font-size:14px;fill:#566278 }
      #setup-root .model { font-family:monospace;font-size:14px;fill:#384da0 }
      #setup-root .line { fill:none;stroke:#566278;stroke-width:1.5 }
      #setup-root .rule { fill:none;stroke:#d6dbe5;stroke-width:1 }
      #setup-root .card { fill:#fff;stroke:#c8cfdd;stroke-width:1;rx:8 }
      #setup-root .focal { fill:#e9ecf8;stroke:#384da0;stroke-width:1.5;rx:8 }
      @media print {
#setup-root .diagram-container { overflow-x:visible }
}</style><marker id="setup-setup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#566278"/></marker></defs>
<rect width="1280" height="720" fill="#f4f5f8"/>
<text x="40" y="44" class="eyebrow">CODEX DESIGN WORKFLOW / 03 — INSTALLATION</text>
<text x="40" y="108" class="title">Set up your own design environment</text>
<text x="40" y="148" class="small">One prompt guides setup. Your accounts and live app connections stay on your computer.</text><path d="M408 364 H456" class="line" marker-end="url(#setup-setup-arrow)"/><path d="M824 364 H872" class="line" marker-end="url(#setup-setup-arrow)"/><rect x="40" y="220" width="368" height="336" class="focal"/><text x="64" y="260" class="eyebrow">01</text><text x="64" y="308" class="heading">Install the bundle</text><text x="64" y="352" class="body">Inspect the task and plan.</text><text x="64" y="380" class="body">Run install + doctor.</text><path d="M64 408 H384" class="rule"/><text x="64" y="448" class="small">Design router</text><text x="64" y="480" class="small">Seven pinned upstream sources</text><text x="64" y="512" class="small">Original licenses + hash checks</text><rect x="456" y="220" width="368" height="336" class="card"/><text x="480" y="260" class="eyebrow">02</text><text x="480" y="308" class="heading">Connect your tools</text><text x="480" y="352" class="body">Install / open BrowserOS Neo.</text><text x="480" y="380" class="body">Pair Codex from its MCP board.</text><path d="M480 408 H800" class="rule"/><text x="480" y="448" class="small">Your own local endpoints</text><text x="480" y="480" class="small">Your own account sign-ins</text><text x="480" y="512" class="small">pen.dev + Penpot: manual setup</text><rect x="872" y="220" width="368" height="336" class="card"/><text x="896" y="260" class="eyebrow">03</text><text x="896" y="308" class="heading">Verify real access</text><text x="896" y="352" class="body">Load the Design skill.</text><text x="896" y="380" class="body">Perform read-only live checks.</text><path d="M896 408 H1216" class="rule"/><text x="896" y="448" class="small">Files installed ≠ tools connected</text><text x="896" y="480" class="small">Neo: open and read a test page</text><text x="896" y="512" class="small">Design apps: read current state</text><text x="40" y="620" class="eyebrow">READY WHEN THE FILES AND THE LIVE CONNECTIONS ARE VERIFIED</text><text x="40" y="660" class="body">The installer preserves existing Codex settings and reports skill conflicts.</text><text x="40" y="688" class="small">No profiles, credentials, private projects or model settings are transferred.</text>
</svg>
